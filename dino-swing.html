<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dino Swing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
    /* Layout: full-bleed canvas stage at dusk; HUD pinned to the top corners; result cards centered over the scene */
    :root {
        --night: #141a42;
        --dusk: #4b3b7c;
        --coral: #ff8a65;
        --sun: #ffd38a;
        --sun-deep: #c4632f;
        --leaf: #63d14e;
        --leaf-deep: #2a7a2a;
        --berry: #ff4f7b;
        --cream: #fff6e8;
        --ink: #10142e;
        --glass: rgba(16, 20, 46, 0.55);
        --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
        --font-body: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
        color-scheme: dark;
    }
    [hidden] { display: none !important; }
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--night);
        color: var(--cream);
        font-family: var(--font-body);
        -webkit-tap-highlight-color: transparent;
    }
    #stage {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: pointer;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .hud {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top, 0px));
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        text-shadow: 0 2px 0 rgba(16, 20, 46, 0.45);
    }
    #hudLeft { left: max(16px, env(safe-area-inset-left, 0px)); }
    #hudRight { right: max(16px, env(safe-area-inset-right, 0px)); align-items: flex-end; }
    .meters {
        font-family: var(--font-display);
        font-size: clamp(40px, 7vw, 64px);
        line-height: 0.9;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
    }
    .meters small { font-size: 0.45em; margin-left: 4px; color: var(--sun); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--glass);
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
    }
    .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--berry);
        box-shadow: inset -2px -2px 0 rgba(0, 0, 0, 0.22);
    }
    #chain { background: var(--sun); color: var(--ink); text-shadow: none; }
    .btnrow { display: flex; gap: 8px; }
    .iconbtn {
        pointer-events: auto;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 50%;
        background: var(--glass);
        color: var(--cream);
        cursor: pointer;
    }
    .iconbtn svg { width: 20px; height: 20px; }
    .best { font-size: 13px; font-weight: 700; color: var(--sun); font-variant-numeric: tabular-nums; }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-block: 24px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        background: radial-gradient(ellipse at center, rgba(16, 20, 46, 0.2), rgba(16, 20, 46, 0.7));
    }
    .card {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
    }
    .logo {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: clamp(60px, 14vw, 108px);
        line-height: 0.82;
        color: var(--leaf);
        text-shadow: 0 6px 0 var(--leaf-deep), 0 14px 30px rgba(0, 0, 0, 0.35);
        transform: rotate(-4deg);
    }
    .logo span { display: block; color: var(--sun); text-shadow: 0 6px 0 var(--sun-deep), 0 14px 30px rgba(0, 0, 0, 0.35); }
    .how {
        display: grid;
        gap: 8px;
        width: 100%;
        margin: 0;
        padding: 14px 16px;
        list-style: none;
        border-radius: 16px;
        background: var(--glass);
        font-size: 15px;
        text-align: left;
    }
    .how li { display: flex; gap: 12px; align-items: baseline; }
    .how b {
        flex: none;
        min-width: 86px;
        font-weight: 800;
        color: var(--sun);
    }
    .start {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.04em;
    }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .sub { margin: 0; font-size: 14px; color: var(--sun); font-weight: 700; }
    .heading {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: clamp(54px, 12vw, 84px);
        line-height: 0.9;
        color: var(--coral);
        text-shadow: 0 6px 0 #9c3b2a, 0 14px 30px rgba(0, 0, 0, 0.35);
        transform: rotate(-3deg);
    }
    .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    .res { padding: 10px 6px 12px; border-radius: 14px; background: var(--glass); }
    .res b {
        display: block;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 32px;
        font-variant-numeric: tabular-nums;
    }
    .res span { font-size: 12px; letter-spacing: 0.08em; color: var(--sun); }
    .cta {
        pointer-events: auto;
        padding: 12px 30px;
        border: none;
        border-radius: 999px;
        background: var(--sun);
        color: var(--ink);
        box-shadow: 0 4px 0 var(--sun-deep);
        font-family: var(--font-body);
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
    }
    .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--sun-deep); }
    .cta:focus-visible, .iconbtn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
    .hint { font-size: 12px; color: var(--cream); opacity: 0.75; }
    @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; }
    }
</style>
</head>
<body>
<div id="stage">
    <canvas id="game" aria-label="Dino Swing のゲーム画面"></canvas>

    <div class="hud" id="hudLeft">
        <div class="meters"><span id="meters">0</span><small>m</small></div>
        <div class="chips">
            <span class="chip"><i class="dot"></i><span id="berries">0</span></span>
            <span class="chip" id="chain" hidden></span>
        </div>
    </div>

    <div class="hud" id="hudRight">
        <div class="btnrow">
            <button class="iconbtn" id="muteBtn" type="button" aria-label="サウンドを切り替え"></button>
            <button class="iconbtn" id="pauseBtn" type="button" aria-label="一時停止">
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5"/><rect x="12" y="3" width="4" height="14" rx="1.5"/></svg>
            </button>
        </div>
        <div class="best">BEST <span id="bestTop">0</span></div>
    </div>

    <div class="overlay" id="titleOv">
        <div class="card">
            <h1 class="logo">DINO<span>SWING</span></h1>
            <ul class="how">
                <li><b>長押し</b><span>舌をのばして、光る花につかまる</span></li>
                <li><b>つかまり中</b><span>舌を巻き取ってどんどん加速</span></li>
                <li><b>はなす</b><span>勢いのまま次の花へジャンプ</span></li>
                <li><b>キノコ</b><span>落ちても赤いキノコで大ジャンプ</span></li>
            </ul>
            <div class="start pulse">クリック・タップ・スペースでスタート</div>
            <div class="hint">川に落ちたらおしまい。ベリーを集めて遠くまで！</div>
        </div>
    </div>

    <div class="overlay" id="pauseOv" hidden>
        <div class="card">
            <h2 class="heading">PAUSED</h2>
            <div class="start">クリックかスペースで再開</div>
        </div>
    </div>

    <div class="overlay" id="overOv" hidden>
        <div class="card">
            <h2 class="heading">SPLASH!</h2>
            <p class="sub" id="overMsg">川に落ちちゃった</p>
            <div class="results">
                <div class="res"><b id="rMeters">0</b><span>距離 m</span></div>
                <div class="res"><b id="rBerries">0</b><span>ベリー</span></div>
                <div class="res"><b id="rScore">0</b><span>スコア</span></div>
            </div>
            <button class="cta" id="retryBtn" type="button">もう一回</button>
            <div class="hint">スペースでもリトライ</div>
        </div>
    </div>
</div>

<script>
(() => {
    // --- Constants ---
    const TAU = Math.PI * 2;
    const VIEW_H = 720;          // world units visible vertically on a landscape screen
    const MIN_VIEW_W = 720;      // keep at least this much world visible horizontally
    const WATER_Y = 640;
    const MUSH_H = 72;
    const STEP = 1 / 120;
    const GRAVITY = 1500;
    const R = 22;                // dino body radius
    const REEL = 120;            // tongue reel-in speed while holding
    const PUMP = 220;            // swing boost while holding, along the current swing direction
    const MIN_LEN = 90;
    const RANGE = 440;           // tongue reach
    const MAX_SPEED = 1700;
    const PX_PER_M = 40;
    const START_X = 260;

    const COLORS = {
        green: '#63d14e',
        outline: '#123a22',
        cream: '#fff6e8',
        red: '#e8475b',
        boot: '#ff9a3c',
        tongue: '#ff5c8a',
        tongueEdge: '#a0204a',
        berry: '#ff4f7b',
        gold: '#ffd34d',
        vine: '#1f5a3a',
        leaf: '#2f8a4a',
        petal: '#ff8fb8',
        sun: '#ffd38a',
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const $ = id => document.getElementById(id);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    // --- Storage (per-viewer convenience only) ---
    function load(key, fallback) {
        try {
            const v = localStorage.getItem(key);
            return v === null ? fallback : JSON.parse(v);
        } catch (e) { return fallback; }
    }
    function save(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
    }

    // --- State ---
    let W = 0, H = 0, dpr = 1, scale = 1, viewW = 0, viewH = 0;
    let mode = 'title';          // title | play | paused | dying | over
    let held = false;
    let suppressRelease = false;
    let time = 0, overAt = 0, deathTimer = 0;
    let p, anchors, berries, mushrooms, particles, popups, trail, fireflies, stars;
    let camX = 0, camY = 0, shake = 0;
    let chain = 0, berryCount = 0, berryPoints = 0, maxX = START_X;
    let lastAnchor, anchorsSinceMush;
    let best = load('dino-swing-best', 0);
    let muted = load('dino-swing-muted', false);

    // --- Audio ---
    let actx = null;
    function ensureAudio() {
        if (!actx) {
            try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
        }
        if (actx && actx.state === 'suspended') actx.resume();
    }
    function tone(f0, f1, dur, type = 'sine', vol = 0.12, delay = 0) {
        if (!actx || muted) return;
        const t = actx.currentTime + delay;
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(actx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
    }
    function noise(dur, vol = 0.2, freq = 900) {
        if (!actx || muted) return;
        const len = Math.floor(actx.sampleRate * dur);
        const buf = actx.createBuffer(1, len, actx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = actx.createBufferSource();
        const filter = actx.createBiquadFilter();
        const g = actx.createGain();
        src.buffer = buf;
        filter.type = 'lowpass';
        filter.frequency.value = freq;
        g.gain.value = vol;
        src.connect(filter).connect(g).connect(actx.destination);
        src.start();
    }
    const sfx = {
        thwip: () => tone(900, 260, 0.09, 'triangle', 0.14),
        miss: () => tone(320, 170, 0.1, 'square', 0.04),
        berry: n => tone(660 * Math.pow(2, Math.min(n, 12) / 12), 1320 * Math.pow(2, Math.min(n, 12) / 12), 0.08, 'sine', 0.1),
        gold: () => { tone(880, 1760, 0.1, 'sine', 0.1); tone(1320, 2640, 0.12, 'sine', 0.08, 0.08); },
        boing: () => tone(140, 560, 0.28, 'sine', 0.18),
        splash: () => { noise(0.6, 0.35, 1200); tone(300, 80, 0.4, 'sine', 0.12); },
        best: () => [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12) * 1.01, 0.16, 'triangle', 0.1, i * 0.1)),
    };

    // --- World generation ---
    function makeAnchor(x, y, amp) {
        return { x, y, baseX: x, amp, phase: Math.random() * TAU, speed: rand(0.8, 1.4), bloom: 0 };
    }

    function reset() {
        anchors = [];
        berries = [];
        mushrooms = [];
        particles = [];
        popups = [];
        trail = [];
        const a0 = makeAnchor(START_X, 170, 0);
        anchors.push(a0);
        lastAnchor = a0;
        anchorsSinceMush = 0;
        p = {
            x: START_X - 230 * Math.sin(0.9), y: 170 + 230 * Math.cos(0.9),
            vx: 0, vy: 0, anchor: a0, len: 230, tongue: 1, missT: 0,
            rot: 0, squash: 0, blink: 2,
        };
        camX = p.x - viewW * 0.32;
        camY = baseCamY();
        shake = 0;
        chain = 0;
        berryCount = 0;
        berryPoints = 0;
        maxX = START_X;
        generate();
    }

    function generate() {
        while (lastAnchor.baseX < camX + viewW + 700) {
            const meters = (lastAnchor.baseX - START_X) / PX_PER_M;
            const diff = clamp(meters / 1200, 0, 1);
            const gap = rand(240, 320) + diff * rand(40, 170);
            const y = clamp(lastAnchor.y + rand(-170, 170), 110, 360);
            const moving = diff > 0.2 && Math.random() < 0.12 + diff * 0.3;
            const a = makeAnchor(lastAnchor.baseX + gap, y, moving ? rand(35, 80) : 0);
            placeBerries(lastAnchor, a);
            anchors.push(a);
            anchorsSinceMush++;
            if (anchorsSinceMush >= 4 && Math.random() < 0.45) {
                mushrooms.push({ x: (lastAnchor.baseX + a.baseX) / 2 + rand(-40, 40), w: 96, squash: 0 });
                anchorsSinceMush = 0;
            }
            lastAnchor = a;
        }
        const behind = camX - 500;
        anchors = anchors.filter(a => a.baseX > behind || a === p.anchor);
        berries = berries.filter(b => b.x > behind);
        mushrooms = mushrooms.filter(m => m.x > behind);
    }

    function placeBerries(a, b) {
        const n = 3 + Math.floor(Math.random() * 3);
        const low = Math.random() < 0.65;
        const gold = Math.random() < 0.08 ? Math.floor(Math.random() * n) : -1;
        for (let i = 0; i < n; i++) {
            const t = (i + 1) / (n + 1);
            const mid = lerp(a.y, b.y, t);
            const arc = Math.sin(Math.PI * t);
            const y = low ? mid + 120 + 90 * arc : mid - 40 - 90 * arc;
            berries.push({ x: lerp(a.baseX, b.baseX, t), y: clamp(y, 70, WATER_Y - 90), gold: i === gold, bob: Math.random() * TAU });
        }
    }

    function makeAmbient() {
        stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: rand(0.6, 1.8), tw: Math.random() * TAU }));
        fireflies = Array.from({ length: reduceMotion ? 8 : 26 }, () => ({ x: Math.random() * 2000, y: rand(0, 300), ph: Math.random() * TAU, sp: rand(8, 22) }));
    }

    // --- Layout ---
    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.clientWidth || window.innerWidth;
        H = canvas.clientHeight || window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        scale = Math.min(H / VIEW_H, W / MIN_VIEW_W) || 1;
        viewW = W / scale;
        viewH = H / scale;
    }
    const baseCamY = () => WATER_Y + 90 - viewH;

    // --- Player actions ---
    function pickAnchor() {
        let bestA = null, bestScore = Infinity;
        for (const a of anchors) {
            const dx = a.x - p.x, dy = a.y - p.y;
            const d = Math.hypot(dx, dy);
            if (d > RANGE || d < 50 || dx < -40 || dy > 30) continue;
            const s = Math.hypot(dx - 200, dy + 170);   // prefer ahead and above
            if (s < bestScore) { bestScore = s; bestA = a; }
        }
        return bestA;
    }

    function attach(a) {
        p.anchor = a;
        p.len = Math.max(MIN_LEN, Math.hypot(a.x - p.x, a.y - p.y));
        p.tongue = 0;
        a.bloom = 1;
        chain++;
        sfx.thwip();
        burst(a.x, a.y, 8, COLORS.petal, 160, 0.4);
        if (chain >= 3) popup(a.x, a.y - 40, `CHAIN ×${chain}`, COLORS.sun);
    }

    function detach() {
        p.anchor = null;
        p.vx *= 1.03;
        p.vy *= 1.03;
    }

    function multiplier() {
        return Math.min(5, 1 + Math.floor(Math.max(0, chain - 1) / 3));
    }

    function press() {
        ensureAudio();
        if (mode === 'title') {
            startGame();
            held = true;
            return;
        }
        if (mode === 'paused') {
            resume();
            return;
        }
        if (mode === 'over') {
            if (time - overAt > 0.7) {
                restart();
                suppressRelease = true;
            }
            return;
        }
        if (mode !== 'play') return;
        held = true;
        if (!p.anchor) {
            const a = pickAnchor();
            if (a) attach(a);
            else { p.missT = 0.2; sfx.miss(); }
        }
    }

    function release() {
        held = false;
        if (suppressRelease) {
            suppressRelease = false;
            return;
        }
        if (mode === 'play' && p.anchor) detach();
    }

    function startGame() {
        mode = 'play';
        $('titleOv').hidden = true;
    }

    function restart() {
        reset();
        mode = 'play';
        $('overOv').hidden = true;
    }

    function pause() {
        if (mode !== 'play') return;
        mode = 'paused';
        held = false;
        $('pauseOv').hidden = false;
    }

    function resume() {
        mode = 'play';
        suppressRelease = true;
        $('pauseOv').hidden = true;
    }

    function die() {
        mode = 'dying';
        deathTimer = 0.7;
        p.anchor = null;
        burst(p.x, WATER_Y, 26, '#bfefff', 420, 0.8, -1);
        shake = 1;
        sfx.splash();
    }

    function showResults() {
        mode = 'over';
        overAt = time;
        const meters = metersNow();
        const score = meters + berryPoints;
        const isBest = score > best;
        if (isBest) {
            best = score;
            save('dino-swing-best', best);
            sfx.best();
        }
        $('rMeters').textContent = meters;
        $('rBerries').textContent = berryCount;
        $('rScore').textContent = score;
        $('overMsg').textContent = isBest ? '自己ベスト更新！' : `ベストまであと ${best - score}`;
        $('overOv').hidden = false;
    }

    const metersNow = () => Math.max(0, Math.floor((maxX - START_X) / PX_PER_M));

    // --- Effects ---
    function burst(x, y, n, color, speed, life, dir = 0) {
        for (let i = 0; i < n; i++) {
            const a = dir < 0 ? rand(-Math.PI * 0.9, -Math.PI * 0.1) : Math.random() * TAU;
            const s = speed * rand(0.3, 1);
            particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, r: rand(2, 5), color });
        }
    }

    function popup(x, y, text, color) {
        popups.push({ x, y, text, color, life: 1 });
    }

    // --- Simulation ---
    function step(dt) {
        time += dt;
        for (const a of anchors) {
            a.x = a.baseX + a.amp * Math.sin(time * a.speed + a.phase);
            a.bloom = Math.max(0, a.bloom - dt * 2);
        }
        for (const m of mushrooms) m.squash = Math.max(0, m.squash - dt * 4);

        if (mode === 'title' || mode === 'play') simulatePlayer(dt);
        else if (mode === 'dying') {
            p.vy = Math.min(p.vy + GRAVITY * dt * 0.3, 200);
            p.y += p.vy * dt;
            p.x += p.vx * dt * 0.2;
            deathTimer -= dt;
            if (deathTimer <= 0) showResults();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const q = particles[i];
            q.life -= dt;
            if (q.life <= 0) { particles.splice(i, 1); continue; }
            q.vy += 700 * dt;
            q.x += q.vx * dt;
            q.y += q.vy * dt;
        }
        for (let i = popups.length - 1; i >= 0; i--) {
            popups[i].life -= dt * 0.9;
            popups[i].y -= 40 * dt;
            if (popups[i].life <= 0) popups.splice(i, 1);
        }
        shake = Math.max(0, shake - dt * 3);
        p.squash = Math.max(0, p.squash - dt * 4);
        p.missT = Math.max(0, p.missT - dt);
        p.tongue = Math.min(1, p.tongue + dt / 0.07);
        p.blink -= dt;
        if (p.blink < -0.12) p.blink = rand(2, 5);
    }

    function simulatePlayer(dt) {
        p.vy += GRAVITY * dt;
        if (p.anchor && held && mode === 'play') p.len = Math.max(MIN_LEN, p.len - REEL * dt);
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.anchor) {
            const a = p.anchor;
            const dx = p.x - a.x, dy = p.y - a.y;
            const d = Math.hypot(dx, dy);
            if (d > p.len) {
                const nx = dx / d, ny = dy / d;
                p.x = a.x + nx * p.len;
                p.y = a.y + ny * p.len;
                const vr = p.vx * nx + p.vy * ny;
                if (vr > 0) {
                    p.vx -= vr * nx;
                    p.vy -= vr * ny;
                }
            }
            if (held && mode === 'play') {
                // Pump the swing so a dead hang can always get going again
                let tx = -(p.y - a.y) / (d || 1), ty = (p.x - a.x) / (d || 1);
                let vt = p.vx * tx + p.vy * ty;
                if (Math.abs(vt) < 30) {
                    if (tx < 0) { tx = -tx; ty = -ty; }
                    vt = 1;
                }
                const s = Math.sign(vt);
                p.vx += tx * s * PUMP * dt;
                p.vy += ty * s * PUMP * dt;
            }
        }

        const sp = Math.hypot(p.vx, p.vy);
        if (sp > MAX_SPEED) {
            p.vx *= MAX_SPEED / sp;
            p.vy *= MAX_SPEED / sp;
        }

        if (mode !== 'play') return;

        maxX = Math.max(maxX, p.x);

        for (let i = berries.length - 1; i >= 0; i--) {
            const b = berries[i];
            if (Math.hypot(b.x - p.x, b.y - p.y) < R + (b.gold ? 18 : 14)) {
                const pts = (b.gold ? 50 : 10) * multiplier();
                berryCount += b.gold ? 5 : 1;
                berryPoints += pts;
                popup(b.x, b.y - 20, `+${pts}`, b.gold ? COLORS.gold : COLORS.cream);
                burst(b.x, b.y, b.gold ? 18 : 8, b.gold ? COLORS.gold : COLORS.berry, 220, 0.45);
                if (b.gold) sfx.gold(); else sfx.berry(berryCount % 12);
                berries.splice(i, 1);
            }
        }

        for (const m of mushrooms) {
            const top = WATER_Y - MUSH_H;
            if (p.vy > 0 && Math.abs(p.x - m.x) < m.w / 2 + R * 0.4 && p.y + R > top && p.y < top + 20) {
                p.y = top - R;
                p.vy = -1200;
                p.vx = Math.max(p.vx, 380);
                if (p.anchor) p.anchor = null;
                p.squash = 1;
                m.squash = 1;
                chain = 0;
                shake = Math.max(shake, 0.35);
                burst(m.x, top, 12, COLORS.red, 260, 0.5, -1);
                popup(m.x, top - 40, 'BOING!', COLORS.cream);
                sfx.boing();
            }
        }

        if (p.y - R > WATER_Y + 6) die();
    }

    function updateCamera(dt) {
        if (mode !== 'dying' && mode !== 'over') {
            const targetX = p.x - viewW * 0.32 + clamp(p.vx, 0, 900) * 0.12;
            camX += (targetX - camX) * Math.min(1, dt * 5);
        }
        const targetY = Math.min(baseCamY(), p.y - 170);
        camY += (targetY - camY) * Math.min(1, dt * 4);
    }

    // --- Rendering ---
    function ridge(x, a, b, c) {
        return Math.sin(x * a) * 60 + Math.sin(x * b + 1.3) * 28 + Math.sin(x * c + 2.1) * 12;
    }

    function drawBackground() {
        const waterView = WATER_Y - camY;

        // Sky
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const ws = waterView * scale;
        const sky = ctx.createLinearGradient(0, ws - 900 * scale, 0, ws);
        sky.addColorStop(0, '#141a42');
        sky.addColorStop(0.45, '#4b3b7c');
        sky.addColorStop(0.8, '#ff8a65');
        sky.addColorStop(1, '#ffc98a');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

        // Stars
        ctx.fillStyle = COLORS.cream;
        for (const s of stars) {
            const y = s.y * (waterView - 380);
            if (y > waterView - 380) continue;
            ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 1.5 + s.tw) * (reduceMotion ? 0 : 1);
            ctx.beginPath();
            ctx.arc(s.x * viewW, y, s.r, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Sun
        const sunX = viewW * 0.72, sunY = waterView - 150;
        const glow = ctx.createRadialGradient(sunX, sunY, 40, sunX, sunY, 260);
        glow.addColorStop(0, 'rgba(255, 211, 138, 0.55)');
        glow.addColorStop(1, 'rgba(255, 211, 138, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(sunX - 260, sunY - 260, 520, 520);
        ctx.fillStyle = COLORS.sun;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 95, 0, TAU);
        ctx.fill();

        // Parallax silhouettes
        const layer = (f, base, color, fn) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, viewH);
            for (let x = 0; x <= viewW + 16; x += 16) {
                ctx.lineTo(x, waterView - base - fn(x + camX * f));
            }
            ctx.lineTo(viewW + 16, viewH);
            ctx.closePath();
            ctx.fill();
        };
        layer(0.08, 150, '#8a4f7d', x => ridge(x, 0.004, 0.011, 0.027) + 40);
        layer(0.25, 90, '#4a2f63', x => ridge(x, 0.006, 0.017, 0.04));
        layer(0.5, 40, '#24204a', x => Math.abs(Math.sin(x * 0.02)) * 48 + Math.sin(x * 0.005) * 26 + 20);

        // Fireflies
        ctx.fillStyle = '#e2ff8a';
        for (const f of fireflies) {
            const fx = ((f.x - camX * 0.6) % (viewW + 100) + viewW + 100) % (viewW + 100) - 50;
            const fy = waterView - 60 - f.y + Math.sin(time * 0.8 + f.ph) * 20;
            ctx.globalAlpha = 0.4 + 0.5 * Math.max(0, Math.sin(time * 2 + f.ph));
            ctx.beginPath();
            ctx.arc(fx, fy, 2.2, 0, TAU);
            ctx.fill();
            f.x += f.sp * 0.016;
        }
        ctx.globalAlpha = 1;
    }

    function drawVineAndFlower(a, target) {
        const top = camY - 20;
        const sway = Math.sin(time * 1.2 + a.phase) * 14;
        ctx.strokeStyle = COLORS.vine;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(a.baseX + sway * 0.3, top);
        ctx.quadraticCurveTo(lerp(a.baseX, a.x, 0.5) + sway, (top + a.y) / 2, a.x, a.y);
        ctx.stroke();

        ctx.fillStyle = COLORS.leaf;
        for (let t = 0.15; t < 0.95; t += 0.18) {
            const lx = lerp(lerp(a.baseX, a.x, t), a.x, t * t) + sway * Math.sin(Math.PI * t);
            const ly = lerp(top, a.y, t);
            if (ly < camY) continue;
            const side = (Math.round(t * 10) % 2 ? 1 : -1);
            ctx.beginPath();
            ctx.ellipse(lx + side * 8, ly, 9, 4, side * 0.6, 0, TAU);
            ctx.fill();
        }

        const inRange = Math.hypot(a.x - p.x, a.y - p.y) < RANGE;
        const glowR = 28 + a.bloom * 20 + (target ? 8 : 0);
        const g = ctx.createRadialGradient(a.x, a.y, 4, a.x, a.y, glowR);
        g.addColorStop(0, inRange ? 'rgba(255, 230, 150, 0.85)' : 'rgba(255, 230, 150, 0.35)');
        g.addColorStop(1, 'rgba(255, 230, 150, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(a.x, a.y, glowR, 0, TAU);
        ctx.fill();

        const bloom = 1 + a.bloom * 0.35;
        ctx.fillStyle = COLORS.petal;
        for (let i = 0; i < 5; i++) {
            const ang = (i / 5) * TAU + time * 0.4;
            ctx.beginPath();
            ctx.arc(a.x + Math.cos(ang) * 10 * bloom, a.y + Math.sin(ang) * 10 * bloom, 7 * bloom, 0, TAU);
            ctx.fill();
        }
        ctx.fillStyle = COLORS.gold;
        ctx.beginPath();
        ctx.arc(a.x, a.y, 7, 0, TAU);
        ctx.fill();

        if (target) {
            ctx.save();
            ctx.strokeStyle = COLORS.cream;
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 7]);
            ctx.lineDashOffset = -time * 30;
            ctx.beginPath();
            ctx.arc(a.x, a.y, 26 + Math.sin(time * 6) * 2, 0, TAU);
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawMushroom(m) {
        const top = WATER_Y - MUSH_H;
        const sq = m.squash;
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#3a1420';
        ctx.fillStyle = '#f3e3c3';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(m.x - 16, top + 6, 32, MUSH_H + 30, 10) : ctx.rect(m.x - 16, top + 6, 32, MUSH_H + 30);
        ctx.fill();
        ctx.stroke();

        const capH = 42 * (1 - sq * 0.35);
        const capW = m.w / 2 * (1 + sq * 0.15);
        ctx.fillStyle = COLORS.red;
        ctx.beginPath();
        ctx.ellipse(m.x, top + 12, capW, capH, 0, Math.PI, TAU);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = COLORS.cream;
        [[-0.5, 0.45, 8], [0.15, 0.7, 10], [0.55, 0.35, 7]].forEach(([fx, fy, r]) => {
            ctx.beginPath();
            ctx.arc(m.x + fx * capW, top + 12 - fy * capH, r, 0, TAU);
            ctx.fill();
        });
    }

    function drawBerry(b) {
        const y = b.y + Math.sin(time * 3 + b.bob) * 4;
        const r = b.gold ? 14 : 11;
        if (b.gold) {
            const g = ctx.createRadialGradient(b.x, y, 4, b.x, y, 34);
            g.addColorStop(0, 'rgba(255, 211, 77, 0.6)');
            g.addColorStop(1, 'rgba(255, 211, 77, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(b.x, y, 34, 0, TAU);
            ctx.fill();
        }
        ctx.fillStyle = b.gold ? COLORS.gold : COLORS.berry;
        ctx.strokeStyle = b.gold ? '#8a5a10' : '#7a1636';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(b.x, y, r, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.beginPath();
        ctx.arc(b.x - r * 0.35, y - r * 0.35, r * 0.28, 0, TAU);
        ctx.fill();
        ctx.fillStyle = COLORS.leaf;
        ctx.beginPath();
        ctx.ellipse(b.x + 3, y - r - 2, 6, 3, -0.5, 0, TAU);
        ctx.fill();
    }

    // Dino faces +x; local origin is the body center
    const MOUTH = { x: 43, y: -13 };

    function mouthWorld() {
        const s = 1 + p.squash * 0.15, t = 1 - p.squash * 0.15;
        const lx = MOUTH.x * s, ly = MOUTH.y * t;
        const c = Math.cos(p.rot), sn = Math.sin(p.rot);
        return { x: p.x + lx * c - ly * sn, y: p.y + lx * sn + ly * c };
    }

    function ell(x, y, rx, ry, fill, rot = 0, stroke = true) {
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, rot, 0, TAU);
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) ctx.stroke();
    }

    function drawDino(look) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1 + p.squash * 0.15, 1 - p.squash * 0.15);
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';

        const dangle = p.anchor ? Math.sin(time * 7) * 2 : Math.sin(time * 14) * 3;
        ell(-8, 20 + dangle, 8, 6, COLORS.boot);
        ell(9, 21 - dangle, 8, 6, COLORS.boot);

        ctx.fillStyle = COLORS.green;
        ctx.beginPath();
        ctx.moveTo(-16, 3);
        ctx.quadraticCurveTo(-34, 2, -42, -10 + Math.sin(time * 5) * 2);
        ctx.quadraticCurveTo(-30, -5, -15, -9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ell(0, 0, 22, 19, COLORS.green);
        ell(7, 6, 12, 11, COLORS.cream, 0, false);
        ell(-6, -15, 13, 6, COLORS.red, -0.2);

        ctx.fillStyle = COLORS.red;
        [[4, -36, 0.2], [-1, -28, 0.5], [-4, -19, 0.8]].forEach(([x, y, r]) => {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-r);
            ctx.beginPath();
            ctx.moveTo(-5, 4);
            ctx.lineTo(0, -6);
            ctx.lineTo(5, 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        });

        ell(16, -22, 14, 13, COLORS.green);
        ell(32, -18, 13, 10, COLORS.green);
        ell(22, -13, 9, 6, COLORS.cream, 0, false);
        ctx.fillStyle = COLORS.outline;
        [[40, -22], [36, -23]].forEach(([x, y]) => {
            ctx.beginPath();
            ctx.arc(x, y, 1.6, 0, TAU);
            ctx.fill();
        });

        if (p.blink < 0) {
            ctx.beginPath();
            ctx.moveTo(12, -32);
            ctx.lineTo(24, -32);
            ctx.stroke();
        } else {
            ell(18, -33, 6, 8, '#ffffff');
            ell(18 + look.x * 2.2, -33 + look.y * 2.6, 2.6, 3.8, '#111111', 0, false);
        }

        if (p.anchor || p.missT > 0) ell(42, -12, 4, 3.5, '#5a1030', 0, false);
        ctx.restore();
    }

    function drawTongue() {
        const m = mouthWorld();
        let ex, ey;
        if (p.anchor) {
            ex = lerp(m.x, p.anchor.x, p.tongue);
            ey = lerp(m.y, p.anchor.y, p.tongue);
        } else if (p.missT > 0) {
            const k = Math.sin((1 - p.missT / 0.2) * Math.PI) * 120;
            ex = m.x + 0.75 * k;
            ey = m.y - 0.66 * k;
        } else return;

        ctx.lineCap = 'round';
        ctx.strokeStyle = COLORS.tongueEdge;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        ctx.strokeStyle = COLORS.tongue;
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.fillStyle = COLORS.tongue;
        ctx.beginPath();
        ctx.arc(ex, ey, 6, 0, TAU);
        ctx.fill();
    }

    function drawWater() {
        const bottom = camY + viewH + 20;
        const g = ctx.createLinearGradient(0, WATER_Y, 0, WATER_Y + 200);
        g.addColorStop(0, '#2a8a96');
        g.addColorStop(1, '#0e2f45');
        ctx.fillStyle = g;
        ctx.beginPath();
        const x0 = camX - 20, x1 = camX + viewW + 20;
        ctx.moveTo(x0, bottom);
        for (let x = x0; x <= x1; x += 14) ctx.lineTo(x, WATER_Y + Math.sin(x * 0.03 + time * 2) * 4);
        ctx.lineTo(x1, bottom);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 220, 180, 0.35)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            const y = WATER_Y + 22 + i * 26;
            ctx.beginPath();
            for (let x = x0; x <= x1; x += 20) {
                const yy = y + Math.sin(x * 0.02 - time * (1.5 + i * 0.4) + i) * 3;
                if (x === x0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
            }
            ctx.globalAlpha = 0.5 - i * 0.12;
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    function draw() {
        drawBackground();

        const sx = reduceMotion ? 0 : (Math.random() - 0.5) * shake * 14;
        const sy = reduceMotion ? 0 : (Math.random() - 0.5) * shake * 14;
        ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (-camX * scale + sx) * dpr, (-camY * scale + sy) * dpr);

        const target = (mode === 'play' && !p.anchor) ? pickAnchor() : null;
        const visible = a => a.x > camX - 80 && a.x < camX + viewW + 80;
        anchors.filter(visible).forEach(a => drawVineAndFlower(a, a === target));
        mushrooms.filter(visible).forEach(drawMushroom);
        berries.filter(visible).forEach(drawBerry);

        // Speed trail
        const speed = Math.hypot(p.vx, p.vy);
        if (mode === 'play' || mode === 'title') {
            trail.push({ x: p.x, y: p.y });
            if (trail.length > 14) trail.shift();
        }
        if (speed > 800) {
            trail.forEach((t, i) => {
                ctx.globalAlpha = (i / trail.length) * 0.25 * Math.min(1, (speed - 800) / 600);
                ctx.fillStyle = COLORS.cream;
                ctx.beginPath();
                ctx.arc(t.x, t.y, R * (i / trail.length), 0, TAU);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Rotation follows the rope while hanging, the velocity while flying
        let rotTarget;
        if (p.anchor) {
            const ropeAng = Math.atan2(p.anchor.x - p.x, p.y - p.anchor.y);
            rotTarget = clamp(ropeAng * 0.7 - 0.45, -1.1, 0.9);
        } else {
            rotTarget = clamp(Math.atan2(p.vy, Math.max(200, p.vx)) * 0.6, -0.7, 0.8);
        }
        p.rot += (rotTarget - p.rot) * 0.2;

        const lookAt = p.anchor || target;
        let look = { x: 1, y: 0 };
        if (lookAt) {
            const d = Math.hypot(lookAt.x - p.x, lookAt.y - p.y) || 1;
            look = { x: (lookAt.x - p.x) / d, y: (lookAt.y - p.y) / d };
        } else if (speed > 1) {
            look = { x: p.vx / speed, y: p.vy / speed };
        }

        drawTongue();
        drawDino(look);
        drawWater();

        for (const q of particles) {
            ctx.globalAlpha = Math.max(0, q.life / q.max);
            ctx.fillStyle = q.color;
            ctx.beginPath();
            ctx.arc(q.x, q.y, q.r, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.textAlign = 'center';
        ctx.font = '26px "Lilita One", "M PLUS Rounded 1c", sans-serif';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(16, 20, 46, 0.7)';
        for (const pu of popups) {
            ctx.globalAlpha = Math.min(1, pu.life * 2);
            ctx.strokeText(pu.text, pu.x, pu.y);
            ctx.fillStyle = pu.color;
            ctx.fillText(pu.text, pu.x, pu.y);
        }
        ctx.globalAlpha = 1;
    }

    // --- HUD ---
    const hudCache = {};
    function setText(id, value) {
        if (hudCache[id] === value) return;
        hudCache[id] = value;
        $(id).textContent = value;
    }

    function updateHUD() {
        setText('meters', String(metersNow()));
        setText('berries', String(berryCount));
        setText('bestTop', String(best));
        const mult = multiplier();
        const chainEl = $('chain');
        const showChain = mode === 'play' && mult > 1;
        if (chainEl.hidden === showChain) chainEl.hidden = !showChain;
        if (showChain) setText('chain', `ベリー ×${mult}`);
    }

    function renderMuteIcon() {
        $('muteBtn').innerHTML = muted
            ? '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3 7h3l4-4v14l-4-4H3z"/><path d="M13 7l5 6M18 7l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
            : '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3 7h3l4-4v14l-4-4H3z"/><path d="M13 6.5a5 5 0 0 1 0 7M15.5 4a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        $('muteBtn').setAttribute('aria-pressed', String(muted));
    }

    function toggleMute() {
        muted = !muted;
        save('dino-swing-muted', muted);
        renderMuteIcon();
    }

    // --- Input ---
    const stage = $('stage');
    stage.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;
        if (e.button !== undefined && e.button !== 0) return;
        press();
    });
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);

    const PRESS_KEYS = new Set(['Space', 'ArrowUp', 'KeyW', 'Enter']);
    window.addEventListener('keydown', e => {
        if (PRESS_KEYS.has(e.code)) {
            e.preventDefault();
            if (!e.repeat) press();
        } else if (e.code === 'KeyP' || e.code === 'Escape') {
            if (mode === 'play') pause(); else if (mode === 'paused') resume();
        } else if (e.code === 'KeyM') {
            toggleMute();
        }
    });
    window.addEventListener('keyup', e => {
        if (PRESS_KEYS.has(e.code)) release();
    });
    window.addEventListener('blur', () => { pause(); held = false; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
    window.addEventListener('resize', resize);

    $('muteBtn').addEventListener('click', toggleMute);
    $('pauseBtn').addEventListener('click', () => { if (mode === 'play') pause(); else if (mode === 'paused') resume(); });
    $('retryBtn').addEventListener('click', () => { ensureAudio(); restart(); });

    // --- Main loop ---
    let last = performance.now(), acc = 0;
    function frame(now) {
        requestAnimationFrame(frame);
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        if (mode !== 'paused') {
            acc += dt;
            while (acc >= STEP) {
                step(STEP);
                acc -= STEP;
            }
            updateCamera(dt);
            if (mode === 'play' || mode === 'title') generate();
        }
        draw();
        updateHUD();
    }

    function start(data) {
        if (data && typeof data.best === 'number') best = Math.max(best, data.best);
        resize();
        makeAmbient();
        reset();
        p.vx = 0;
        renderMuteIcon();
        requestAnimationFrame(t => { last = t; frame(t); });
    }

    window.claude?.hot?.snapshot?.(() => ({ best }));
    if (window.claude?.hot?.ready) window.claude.hot.ready(start);
    else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
