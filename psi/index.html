<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PSI（仮題）</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="haze" aria-hidden="true"></div>
<div class="app" id="app">
    <header class="top" id="top" hidden>
        <div class="meter" id="meter"></div>
        <div class="dayline">
            <div class="day-info">
                <p class="date" id="date"></p>
                <p class="money" id="money" hidden></p>
            </div>
            <button class="extinguish" id="extinguish" type="button" aria-disabled="true" aria-describedby="toast" hidden></button>
        </div>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
    <footer class="event" id="event" hidden></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
</div>
<noscript><p class="noscript">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
