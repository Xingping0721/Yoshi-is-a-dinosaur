<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Illustration made for this game: a white sky that could be rain clouds or haze. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cbc6"/>
      <stop offset="0.6" stop-color="#d9d8d0"/>
      <stop offset="1" stop-color="#e4e0d4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="haze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="690" cy="150" r="46" fill="#efe6cf" opacity="0.7" filter="url(#haze)"/>
  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="220" cy="170" rx="240" ry="70" fill="#b9bbb6"/>
    <ellipse cx="560" cy="230" rx="300" ry="80" fill="#c2c2bb"/>
    <ellipse cx="860" cy="120" rx="200" ry="60" fill="#b4b6b1"/>
  </g>
  <g fill="#9a9a93" opacity="0.55" filter="url(#haze)">
    <rect x="120" y="300" width="70" height="240"/>
    <rect x="210" y="340" width="90" height="200"/>
    <rect x="610" y="280" width="60" height="260"/>
    <rect x="690" y="330" width="110" height="210"/>
  </g>
  <g fill="#6f6e68">
    <path d="M0 470 L80 430 L160 470 L160 540 L0 540 Z"/>
    <path d="M150 480 L260 420 L370 480 L370 540 L150 540 Z"/>
    <path d="M520 470 L620 425 L720 470 L720 540 L520 540 Z"/>
    <path d="M700 485 L820 430 L960 480 L960 540 L700 540 Z"/>
  </g>
</svg>
